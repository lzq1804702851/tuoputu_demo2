<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>物流通信系统拓扑图 Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; font-family: "Microsoft YaHei", sans-serif; overflow: hidden; }
    #toolbar {
      height: 48px; background: #16213e; display: flex; align-items: center;
      padding: 0 20px; gap: 16px; border-bottom: 1px solid #1e3a5f;
    }
    #toolbar h3 { color: #38bdf8; font-size: 16px; }
    #toolbar span { color: #64748b; font-size: 13px; }
    #info { margin-left: auto; color: #475569; font-size: 12px; }
    #faultBtn {
      background: #991b1b33; border: 1px solid #ef4444; color: #fca5a5;
      padding: 4px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
      font-family: "Microsoft YaHei", sans-serif; transition: all 0.2s;
    }
    #faultBtn:hover { background: #991b1b66; }
    #faultBtn.active { background: #ef4444; color: #fff; border-color: #ef4444; }
    #keyBtn {
      background: #854d0e33; border: 1px solid #eab308; color: #fde68a;
      padding: 4px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
      font-family: "Microsoft YaHei", sans-serif; transition: all 0.2s;
    }
    #keyBtn:hover { background: #854d0e66; }
    #keyBtn.active { background: #eab308; color: #1c1917; border-color: #eab308; }
    svg { display: block; }
    .draggable { cursor: grab; }
    .draggable:hover { filter: brightness(1.3); }
    #legend {
      position: fixed; left: 16px; bottom: 16px;
      background: #0f172aee; border: 1px solid #1e3a5f; border-radius: 8px;
      padding: 12px 14px; z-index: 10; font-size: 12px; color: #cbd5e1;
      pointer-events: none; user-select: none;
    }
    #legend h4 { color: #94a3b8; font-size: 11px; margin-bottom: 6px; }
    #legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
    #legend .row svg { flex-shrink: 0; }
    #legend .sep { border-top: 1px solid #1e293b; margin: 8px 0; }
  </style>
  </style>
</head>
<body>
  <div id="toolbar">
    <h3>物流通信系统拓扑图</h3>
    <span>拖拽节点 | 滚轮缩放 | 空白处平移</span>
    <span id="info"></span>
    <button id="faultBtn" onclick="toggleFaultMode()">故障筛选</button>
    <button id="keyBtn" onclick="toggleKeyMode()">聚焦关键</button>
  </div>
  <svg id="canvas"></svg>

  <!-- 固定图例 -->
  <div id="legend"></div>

  <script>
    // ========== 链路样式 ==========
    const linkStyles = {
      fiber:     { color: '#22d3ee', width: 1.5, dash: '',          name: '光纤' },
      satellite: { color: '#a78bfa', width: 1.5, dash: '8 4',      name: '卫星通道' },
      vhf:       { color: '#fbbf24', width: 1.5, dash: '3 3',      name: '短波通道' },
      '4g':      { color: '#34d399', width: 1.5, dash: '2 4 6 4',  name: '4G网络' },
      '5g':      { color: '#f472b6', width: 1.5, dash: '6 3 2 3',  name: '5G网络' },
      cable:     { color: '#fb923c', width: 2,   dash: '',          name: '网线' },
      microwave: { color: '#67e8f9', width: 1.5, dash: '10 2 3 2', name: '微波' },
    };

    const deviceIcons = {
      server: '🖥', switch: '🔌', router: '🔀',
      'comm-device': '📡', terminal: '💻', transponder: '📶',
      antenna: '📏', base: '🏠',
    };

    // ========== 数据生成 ==========
    const groups = [];
    const links = [];

    // 工具
    let gid = 0;
    function addGroup(id, name, color, cx, cy, r, nodesDef, internalDef, statusOverrides, isKey) {
      const nodes = nodesDef.map((nd, i) => {
        const angle = -90 + (360 / nodesDef.length) * i;
        return {
          id: `${id}-${nd[0]}`, name: nd[1], type: nd[2], r: nd[3],
          angle, status: (statusOverrides && statusOverrides[nd[0]]) || 'normal',
        };
      });
      const internalLinks = internalDef.map(([s, t]) => ({ source: `${id}-${s}`, target: `${id}-${t}`, type: 'internal' }));
      groups.push({ id, name, color, cx, cy, r, nodes, isKey: !!isKey });
      internalLinks.forEach(l => links.push(l));
      gid++;
    }

    // === 布局：大画布 4000x3000 ===
    const W = 4000, H = 3000;

    // 区域调度中心 (6个)
    const hubPositions = [
      [400, 400], [1200, 300], [2200, 350], [3200, 400], [800, 1200], [2600, 1100],
    ];
    const hubNames = ['华北调度中心', '华东调度中心', '华南调度中心', '西南调度中心', '华中调度中心', '西北调度中心'];
    const hubIds = [];
    hubPositions.forEach(([cx, cy], i) => {
      const id = `hub${i}`;
      hubIds.push(id);
      addGroup(id, hubNames[i], '#f97316', cx, cy, 110,
        [['srv','调度服务器','server',22],['sw','交换机','switch',20],['rt','路由器','router',22],['comm','通信控制器','comm-device',22]],
        [['srv','sw'],['sw','rt'],['rt','comm']],
        null, i === 0
      );
    });

    // 通信卫星 (5个)
    const satPositions = [
      [700, 100], [1600, 80], [2500, 100], [3400, 120], [2000, 200],
    ];
    const satNames = ['天通一号', '中星六号', '亚太七号', '天通二号', '中星九号'];
    const satIds = [];
    satPositions.forEach(([cx, cy], i) => {
      const id = `sat${i}`;
      satIds.push(id);
      addGroup(id, satNames[i], '#a855f7', cx, cy, 80,
        [['trans','转发器','transponder',18],['comm','通信模块','comm-device',20]],
        [['trans','comm']],
        i === 3 ? { comm: 'error' } : null, i === 0
      );
    });

    // 中继通信站 (8个)
    const staPositions = [
      [300, 900], [1000, 800], [1700, 750], [2400, 800],
      [3100, 850], [600, 1600], [1500, 1500], [3000, 1500],
    ];
    const staNames = ['北京中继站','上海中继站','广州中继站','成都中继站','昆明中继站','武汉中继站','西安中继站','乌鲁木齐中继站'];
    const staIds = [];
    staPositions.forEach(([cx, cy], i) => {
      const id = `sta${i}`;
      staIds.push(id);
      addGroup(id, staNames[i], '#eab308', cx, cy, 95,
        [['rt','路由器','router',18],['csat','卫星通信机','comm-device',20],['cvhf','短波电台','comm-device',20],['cmw','微波天线','antenna',18]],
        [['rt','csat'],['rt','cvhf'],['rt','cmw']],
        i === 5 ? { rt: 'error' } : (i === 7 ? { csat: 'error' } : null), i === 0 || i === 2
      );
    });

    // 货运飞机 (6架)
    const planePositions = [
      [500, 600], [1300, 550], [2100, 500], [2900, 550],
      [900, 1000], [2300, 950],
    ];
    const planeNames = ['货航CA-101','货航CA-102','货航CA-103','货航CA-104','货航CA-105','货航CA-106'];
    const planeIds = [];
    planePositions.forEach(([cx, cy], i) => {
      const id = `plane${i}`;
      planeIds.push(id);
      addGroup(id, planeNames[i], '#3b82f6', cx, cy, 90,
        [['term','机载终端','terminal',16],['rt','机载路由器','router',18],['comm','卫星通信机','comm-device',20]],
        [['term','rt'],['rt','comm']],
        i === 2 ? { comm: 'error' } : null
      );
    });

    // 货运轮船 (10艘)
    const shipPositions = [
      [400, 1400], [800, 1700], [1200, 1450], [1600, 1800],
      [2000, 1500], [2400, 1750], [2800, 1400], [3200, 1700],
      [600, 2100], [1800, 2200],
    ];
    const shipNames = ['远洋和平号','远洋奋斗号','远洋团结号','远洋创新号','远洋探索号','远洋东方号','远洋星辰号','远洋远航号','远洋朝阳号','远洋长风号'];
    const shipIds = [];
    shipPositions.forEach(([cx, cy], i) => {
      const id = `ship${i}`;
      shipIds.push(id);
      addGroup(id, shipNames[i], '#06b6d4', cx, cy, 95,
        [['term','船载终端','terminal',16],['rt','船载路由器','router',18],['csat','卫星通信机','comm-device',20],['cvhf','短波电台','comm-device',18]],
        [['term','rt'],['rt','csat'],['rt','cvhf']],
        i === 3 ? { csat: 'error' } : (i === 7 ? { rt: 'error' } : (i === 9 ? { term: 'error' } : null)), i === 0
      );
    });

    // 运输车队 (15支)
    const truckPositions = [
      [200, 1900], [500, 2200], [800, 2500], [1100, 2000], [1400, 2300],
      [1700, 2600], [2000, 2100], [2300, 2400], [2600, 1900], [2900, 2200],
      [3200, 2500], [3500, 2000], [3800, 2300], [1500, 2700], [3000, 2700],
    ];
    const truckNames = ['京A车队','沪B车队','粤C车队','川D车队','鄂E车队','陕F车队','渝G车队','湘H车队','赣I车队','浙J车队','鲁K车队','闽L车队','桂M车队','云N车队','贵P车队'];
    const truckIds = [];
    truckPositions.forEach(([cx, cy], i) => {
      const id = `truck${i}`;
      truckIds.push(id);
      addGroup(id, truckNames[i], '#22c55e', cx, cy, 75,
        [['term','车载终端','terminal',14],['rt','车载路由器','router',16],['comm','4G模块','comm-device',16]],
        [['term','rt'],['rt','comm']],
        i === 4 ? { rt: 'error' } : (i === 9 ? { comm: 'error' } : (i === 13 ? { term: 'error' } : null))
      );
    });

    // === 生成外部连线 ===
    function addLink(src, srcPort, tgt, tgtPort, type, status) {
      links.push({ source: `${src}-${srcPort}`, target: `${tgt}-${tgtPort}`, type, status: status || 'normal' });
    }

    // 调度中心 → 卫星
    hubIds.forEach((h, hi) => {
      addLink(h, 'comm', satIds[hi % satIds.length], 'comm', 'satellite');
      addLink(h, 'comm', satIds[(hi + 2) % satIds.length], 'comm', 'satellite', hi === 1 ? 'error' : 'normal');
    });

    // 卫星 → 飞机
    planeIds.forEach((p, pi) => {
      addLink(satIds[pi % satIds.length], 'comm', p, 'comm', 'satellite');
    });

    // 卫星 → 轮船
    shipIds.forEach((s, si) => {
      addLink(satIds[si % satIds.length], 'comm', s, 'csat', 'satellite', si === 5 ? 'error' : 'normal');
    });

    // 卫星 → 通信站
    staIds.forEach((s, si) => {
      addLink(satIds[si % satIds.length], 'comm', s, 'csat', 'satellite');
    });

    // 调度中心之间光纤
    for (let i = 0; i < hubIds.length; i++) {
      addLink(hubIds[i], 'rt', hubIds[(i + 1) % hubIds.length], 'rt', 'fiber');
      if (i % 2 === 0) addLink(hubIds[i], 'sw', hubIds[(i + 3) % hubIds.length], 'sw', 'fiber');
    }

    // 调度中心 → 通信站
    hubIds.forEach((h, hi) => {
      addLink(h, 'comm', staIds[hi % staIds.length], 'csat', 'cable');
      if (hi < 4) addLink(h, 'comm', staIds[(hi + 4) % staIds.length], 'cmw', 'microwave');
    });

    // 通信站之间微波
    for (let i = 0; i < staIds.length - 1; i++) {
      if (i % 3 === 0) addLink(staIds[i], 'cmw', staIds[(i + 1) % staIds.length], 'cmw', 'microwave');
    }

    // 通信站 → 轮船短波
    staIds.forEach((s, si) => {
      if (si < shipIds.length) addLink(s, 'cvhf', shipIds[si], 'cvhf', 'vhf');
      if (si + 4 < shipIds.length) addLink(s, 'cvhf', shipIds[si + 4], 'cvhf', 'vhf', si === 2 ? 'error' : 'normal');
    });

    // 轮船之间短波（相邻）
    for (let i = 0; i < shipIds.length - 1; i++) {
      addLink(shipIds[i], 'cvhf', shipIds[i + 1], 'cvhf', 'vhf');
    }
    // 轮船远距离短波
    for (let i = 0; i < shipIds.length; i += 3) {
      if (i + 2 < shipIds.length) addLink(shipIds[i], 'cvhf', shipIds[i + 2], 'cvhf', 'vhf', i === 3 ? 'error' : 'normal');
    }

    // 调度中心 → 车队 (4G/5G)
    truckIds.forEach((t, ti) => {
      const hubIdx = ti % hubIds.length;
      const linkType = ti % 3 === 0 ? '5g' : '4g';
      addLink(hubIds[hubIdx], 'comm', t, 'comm', linkType, ti === 7 ? 'error' : 'normal');
    });

    // 车队之间5G网状
    for (let i = 0; i < truckIds.length - 1; i++) {
      if (i % 2 === 0) addLink(truckIds[i], 'comm', truckIds[i + 1], 'comm', '5g');
    }

    // ========== SVG ==========
    const NS = 'http://www.w3.org/2000/svg';
    function el(tag, attrs = {}, parent = null) {
      const e = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
      if (parent) parent.appendChild(e);
      return e;
    }
    function txt(content, attrs = {}, parent = null) {
      const t = el('text', attrs, parent);
      t.textContent = content;
      return t;
    }

    // 初始化坐标
    const nodePos = {};
    function syncNodePos() {
      groups.forEach(g => {
        g.nodes.forEach(n => {
          const dist = g.r * 0.52;
          const rad = (n.angle * Math.PI) / 180;
          nodePos[n.id] = { cx: g.cx + dist * Math.cos(rad), cy: g.cy + dist * Math.sin(rad), r: n.r, groupId: g.id };
        });
      });
    }
    syncNodePos();

    // ========== 力导向布局 ==========
    // 第一步：按类型分层，用网格铺开初始位置
    function initGridLayout() {
      // 类型 → 层号（从上到下）
      const typeLayer = {
        '#a855f7': 0,  // 卫星
        '#f97316': 1,  // 调度中心
        '#3b82f6': 2,  // 飞机
        '#eab308': 2,  // 通信站
        '#06b6d4': 3,  // 轮船
        '#22c55e': 4,  // 车队
      };
      // 按层分组
      const layers = {};
      groups.forEach(g => {
        const layer = typeLayer[g.color] ?? 2;
        if (!layers[layer]) layers[layer] = [];
        layers[layer].push(g);
      });

      const layerCount = Object.keys(layers).length;
      const layerH = H / (layerCount + 1);

      Object.entries(layers).forEach(([layerIdx, gs]) => {
        const li = parseInt(layerIdx);
        const y = layerH * (li + 1);
        const totalW = gs.reduce((s, g) => s + g.r * 2, 0);
        const spacing = Math.max(120, (W - 200 - totalW) / (gs.length));
        let x = (W - (totalW + spacing * (gs.length - 1))) / 2;
        gs.forEach(g => {
          g.cx = x + g.r;
          g.cy = y + (Math.random() - 0.5) * 40; // 轻微随机偏移避免对齐太死
          x += g.r * 2 + spacing;
        });
      });
    }

    // 第二步：力导向微调
    function forceLayout(iterations) {
      const cx = W / 2, cy = H / 2;
      // 构建大圆之间的邻接表和权重
      const adj = {};
      groups.forEach(g => adj[g.id] = {});
      links.filter(l => l.type !== 'internal').forEach(l => {
        const sg = groups.find(g => g.nodes.some(n => n.id === l.source));
        const tg = groups.find(g => g.nodes.some(n => n.id === l.target));
        if (sg && tg && sg.id !== tg.id) {
          adj[sg.id][tg.id] = (adj[sg.id][tg.id] || 0) + 1;
          adj[tg.id][sg.id] = (adj[tg.id][sg.id] || 0) + 1;
        }
      });

      // 类型层Y目标
      const typeLayer = { '#a855f7': 0, '#f97316': 1, '#3b82f6': 2, '#eab308': 2, '#06b6d4': 3, '#22c55e': 4 };
      const maxLayer = 4;
      const layerH = H / (maxLayer + 2);

      for (let iter = 0; iter < iterations; iter++) {
        const alpha = 1 - iter / iterations;
        const forces = {};
        groups.forEach(g => forces[g.id] = { fx: 0, fy: 0 });

        // 1. 斥力：碰撞排斥
        for (let i = 0; i < groups.length; i++) {
          for (let j = i + 1; j < groups.length; j++) {
            const a = groups[i], b = groups[j];
            let dx = a.cx - b.cx, dy = a.cy - b.cy;
            let dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const minDist = a.r + b.r + 100;
            if (dist < minDist) {
              const push = (minDist - dist) * 0.5 * alpha;
              const nx = dx / dist, ny = dy / dist;
              forces[a.id].fx += nx * push;
              forces[a.id].fy += ny * push;
              forces[b.id].fx -= nx * push;
              forces[b.id].fy -= ny * push;
            }
            // 长距离温和排斥，利用空间
            const softRepel = 50000 / (dist * dist) * alpha;
            forces[a.id].fx += (dx / dist) * softRepel;
            forces[a.id].fy += (dy / dist) * softRepel;
            forces[b.id].fx -= (dx / dist) * softRepel;
            forces[b.id].fy -= (dy / dist) * softRepel;
          }
        }

        // 2. 引力：有连线的节点互相吸引，越多的连线引力越强
        groups.forEach(g => {
          Object.entries(adj[g.id]).forEach(([otherId, weight]) => {
            const o = groups.find(gg => gg.id === otherId);
            if (!o) return;
            const dx = o.cx - g.cx, dy = o.cy - g.cy;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const idealDist = g.r + o.r + 250;
            const attract = (dist - idealDist) * 0.008 * Math.sqrt(weight) * alpha;
            forces[g.id].fx += (dx / dist) * attract;
            forces[g.id].fy += (dy / dist) * attract;
          });
        });

        // 3. 分层力：按类型锁定垂直位置
        groups.forEach(g => {
          const layer = typeLayer[g.color] ?? 2;
          const targetY = layerH * (layer + 1.5);
          forces[g.id].fy += (targetY - g.cy) * 0.03 * alpha;
          // 水平居中力（温和）
          forces[g.id].fx += (cx - g.cx) * 0.0005 * alpha;
        });

        // 4. 边界排斥
        groups.forEach(g => {
          const pad = g.r + 40;
          if (g.cx < pad) forces[g.id].fx += (pad - g.cx) * 0.5;
          if (g.cx > W - pad) forces[g.id].fx -= (g.cx - (W - pad)) * 0.5;
          if (g.cy < pad) forces[g.id].fy += (pad - g.cy) * 0.5;
          if (g.cy > H - pad) forces[g.id].fy -= (g.cy - (H - pad)) * 0.5;
        });

        // 应用力
        groups.forEach(g => {
          const maxStep = 30 * alpha;
          let fx = forces[g.id].fx, fy = forces[g.id].fy;
          const mag = Math.sqrt(fx * fx + fy * fy) || 1;
          if (mag > maxStep) { fx = fx / mag * maxStep; fy = fy / mag * maxStep; }
          g.cx += fx;
          g.cy += fy;
          g.cx = Math.max(g.r + 20, Math.min(W - g.r - 20, g.cx));
          g.cy = Math.max(g.r + 40, Math.min(H - g.r - 20, g.cy));
        });
      }

      syncNodePos();
    }

    initGridLayout();
    forceLayout(500);

    function getGroupByNodeId(nid) { return groups.find(g => g.nodes.some(n => n.id === nid)); }

    const svg = document.getElementById('canvas');
    const vb = { x: 0, y: 0, w: W, h: H };
    svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    svg.setAttribute('width', '100%');
    svg.style.height = 'calc(100vh - 48px)';

    function screenToSvg(sx, sy) {
      const rect = svg.getBoundingClientRect();
      const s = vb.w / rect.width;
      return { x: (sx - rect.left) * s + vb.x, y: (sy - rect.top) * s + vb.y };
    }

    // 拖拽
    let drag = null;
    svg.addEventListener('mousedown', e => {
      const nodeId = e.target.getAttribute('data-node-id');
      const groupId = e.target.getAttribute('data-group-id');
      if (nodeId) {
        e.preventDefault();
        const p = nodePos[nodeId];
        drag = { type: 'node', id: nodeId, startCx: p.cx, startCy: p.cy, mouseX: e.clientX, mouseY: e.clientY };
        svg.style.cursor = 'grabbing';
      } else if (groupId) {
        e.preventDefault();
        const g = groups.find(g => g.id === groupId);
        const co = {};
        g.nodes.forEach(n => { const p = nodePos[n.id]; co[n.id] = { dx: p.cx - g.cx, dy: p.cy - g.cy }; });
        drag = { type: 'group', id: groupId, startCx: g.cx, startCy: g.cy, mouseX: e.clientX, mouseY: e.clientY, co };
        svg.style.cursor = 'grabbing';
      } else if (e.target === svg || e.target.tagName === 'rect') {
        drag = { type: 'pan', mouseX: e.clientX, mouseY: e.clientY };
        svg.style.cursor = 'grabbing';
      }
    });
    document.addEventListener('mousemove', e => {
      if (!drag) return;
      e.preventDefault();
      if (drag.type === 'pan') {
        const rect = svg.getBoundingClientRect(), s = vb.w / rect.width;
        vb.x -= (e.clientX - drag.mouseX) * s; vb.y -= (e.clientY - drag.mouseY) * s;
        drag.mouseX = e.clientX; drag.mouseY = e.clientY;
        svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
        return;
      }
      const cur = screenToSvg(e.clientX, e.clientY);
      const start = screenToSvg(drag.mouseX, drag.mouseY);
      const ddx = cur.x - start.x, ddy = cur.y - start.y;
      if (drag.type === 'node') {
        const g = getGroupByNodeId(drag.id);
        const nx = drag.startCx + ddx, ny = drag.startCy + ddy;
        const dx = nx - g.cx, dy = ny - g.cy, dist = Math.sqrt(dx * dx + dy * dy);
        const max = g.r - nodePos[drag.id].r - 3;
        if (dist > max && dist > 0) { nodePos[drag.id].cx = g.cx + (dx / dist) * max; nodePos[drag.id].cy = g.cy + (dy / dist) * max; }
        else { nodePos[drag.id].cx = nx; nodePos[drag.id].cy = ny; }
      } else if (drag.type === 'group') {
        const g = groups.find(g => g.id === drag.id);
        g.cx = drag.startCx + ddx; g.cy = drag.startCy + ddy;
        for (const [nid, off] of Object.entries(drag.co)) { nodePos[nid].cx = g.cx + off.dx; nodePos[nid].cy = g.cy + off.dy; }
      }
      render();
    });
    document.addEventListener('mouseup', () => { drag = null; svg.style.cursor = 'default'; });
    svg.addEventListener('wheel', e => {
      e.preventDefault();
      const rect = svg.getBoundingClientRect();
      const mx = (e.clientX - rect.left) / rect.width, my = (e.clientY - rect.top) / rect.height;
      const f = e.deltaY > 0 ? 1.1 : 0.9;
      const nw = vb.w * f, nh = vb.h * f;
      vb.x += (vb.w - nw) * mx; vb.y += (vb.h - nh) * my;
      vb.w = nw; vb.h = nh;
      svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    });

    // ========== 故障筛选模式 ==========
    let faultMode = false;
    let keyMode = false;

    function toggleFaultMode() {
      faultMode = !faultMode;
      if (faultMode && keyMode) { keyMode = false; document.getElementById('keyBtn').classList.remove('active'); document.getElementById('keyBtn').textContent = '聚焦关键'; }
      const btn = document.getElementById('faultBtn');
      btn.classList.toggle('active', faultMode);
      btn.textContent = faultMode ? '退出故障筛选' : '故障筛选';
      if (faultMode) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        groups.forEach(g => {
          if (groupHasError(g)) { minX = Math.min(minX, g.cx - g.r); minY = Math.min(minY, g.cy - g.r); maxX = Math.max(maxX, g.cx + g.r); maxY = Math.max(maxY, g.cy + g.r); }
        });
        links.filter(l => l.status === 'error').forEach(l => {
          const sp = nodePos[l.source], tp = nodePos[l.target];
          if (sp) { minX = Math.min(minX, sp.cx - 60); minY = Math.min(minY, sp.cy - 60); maxX = Math.max(maxX, sp.cx + 60); maxY = Math.max(maxY, sp.cy + 60); }
          if (tp) { minX = Math.min(minX, tp.cx - 60); minY = Math.min(minY, tp.cy - 60); maxX = Math.max(maxX, tp.cx + 60); maxY = Math.max(maxY, tp.cy + 60); }
        });
        if (minX < Infinity) { const pad = 200; vb.x = minX - pad; vb.y = minY - pad; vb.w = (maxX - minX) + pad * 2; vb.h = (maxY - minY) + pad * 2; svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
      }
      render();
    }

    function toggleKeyMode() {
      keyMode = !keyMode;
      if (keyMode && faultMode) { faultMode = false; document.getElementById('faultBtn').classList.remove('active'); document.getElementById('faultBtn').textContent = '故障筛选'; }
      const btn = document.getElementById('keyBtn');
      btn.classList.toggle('active', keyMode);
      btn.textContent = keyMode ? '退出聚焦' : '聚焦关键';
      if (keyMode) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        groups.filter(g => g.isKey).forEach(g => {
          minX = Math.min(minX, g.cx - g.r - 100); minY = Math.min(minY, g.cy - g.r - 100);
          maxX = Math.max(maxX, g.cx + g.r + 100); maxY = Math.max(maxY, g.cy + g.r + 100);
        });
        if (minX < Infinity) { const pad = 250; vb.x = minX - pad; vb.y = minY - pad; vb.w = (maxX - minX) + pad * 2; vb.h = (maxY - minY) + pad * 2; svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
      }
      render();
    }

    // 判断是否该暗淡
    function shouldDim(g) {
      if (!faultMode && !keyMode) return false;
      if (faultMode) return !groupHasError(g);
      if (keyMode) return !g.isKey;
      return false;
    }

    function groupHasError(g) {
      return g.nodes.some(n => n.status === 'error') || links.some(l => {
        if (l.status !== 'error') return false;
        const sg = groups.find(gg => gg.nodes.some(n => n.id === l.source));
        const tg = groups.find(gg => gg.nodes.some(n => n.id === l.target));
        return sg?.id === g.id || tg?.id === g.id;
      });
    }

    // ========== 渲染 ==========
    function render() {
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      const defs = el('defs', {}, svg);
      const pat = el('pattern', { id: 'g', width: 40, height: 40, patternUnits: 'userSpaceOnUse' }, defs);
      el('path', { d: 'M 40 0 L 0 0 0 40', fill: 'none', stroke: '#1e293b', 'stroke-width': 0.5 }, pat);
      el('rect', { width: 20000, height: 20000, x: -10000, y: -10000, fill: '#0f172a' }, svg);
      el('rect', { width: 20000, height: 20000, x: -10000, y: -10000, fill: 'url(#g)' }, svg);

      const linkLayer = el('g', {}, svg);
      const groupLayer = el('g', {}, svg);
      const nodeLayer = el('g', {}, svg);
      const labelLayer = el('g', {}, svg);

      // 故障模式下收集中断链路两端的节点ID，需要显示
      const faultLinkNodes = new Set();
      if (faultMode) {
        links.filter(l => l.status === 'error').forEach(l => {
          faultLinkNodes.add(l.source);
          faultLinkNodes.add(l.target);
        });
      }

      // 连线
      links.forEach(link => {
        const sp = nodePos[link.source], tp = nodePos[link.target];
        if (!sp || !tp) return;

        if (link.type === 'internal') {
          el('line', {
            x1: sp.cx, y1: sp.cy, x2: tp.cx, y2: tp.cy,
            stroke: '#334155', 'stroke-width': 1, 'stroke-dasharray': '4 2',
            opacity: faultMode ? 0.06 : 1,
          }, linkLayer);
          return;
        }

        const style = linkStyles[link.type] || linkStyles.cable;
        const isError = link.status === 'error';
        // 判断连线是否涉及关键节点（关键模式下非关键连线也变淡）
        const srcGroup = groups.find(g => g.nodes.some(n => n.id === link.source));
        const tgtGroup = groups.find(g => g.nodes.some(n => n.id === link.target));
        const isKeyLink = (srcGroup?.isKey || tgtGroup?.isKey);
        const dimOpacity = (faultMode && !isError) || (keyMode && !isKeyLink) ? 0.08 : 1;
        if (dimOpacity < 1) {
          // 变淡但还画
          const color2 = style.color;
          const dx = tp.cx - sp.cx, dy = tp.cy - sp.cy;
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          const x1 = sp.cx + (dx / len) * (sp.r + 2), y1 = sp.cy + (dy / len) * (sp.r + 2);
          const x2 = tp.cx - (dx / len) * (tp.r + 2), y2 = tp.cy - (dy / len) * (tp.r + 2);
          const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
          const cpx = mx - dy * 0.08, cpy = my + dx * 0.08;
          el('path', { d: `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`, fill: 'none', stroke: color2, 'stroke-width': style.width, 'stroke-dasharray': style.dash, opacity: 0.08 }, linkLayer);
          return;
        }

        const color = isError ? '#ef4444' : style.color;
        const w = isError ? 2 : style.width;
        const dash = isError ? '' : style.dash;
        const dx = tp.cx - sp.cx, dy = tp.cy - sp.cy;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const x1 = sp.cx + (dx / len) * (sp.r + 2), y1 = sp.cy + (dy / len) * (sp.r + 2);
        const x2 = tp.cx - (dx / len) * (tp.r + 2), y2 = tp.cy - (dy / len) * (tp.r + 2);
        const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        const cpx = mx - dy * 0.08, cpy = my + dx * 0.08;
        const pathD = `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`;
        const gp = el('path', { d: pathD, fill: 'none', stroke: color, 'stroke-width': w + 3, opacity: 0.1, 'stroke-dasharray': dash }, linkLayer);
        const mp = el('path', { d: pathD, fill: 'none', stroke: color, 'stroke-width': w, 'stroke-dasharray': dash }, linkLayer);
        if (isError) {
          el('animate', { attributeName: 'opacity', values: '0.2;0.8;0.2', dur: '1s', repeatCount: 'indefinite' }, gp);
          el('animate', { attributeName: 'opacity', values: '0.3;1;0.3', dur: '1s', repeatCount: 'indefinite' }, mp);
          const ex = (x1 + x2) / 2, ey = (y1 + y2) / 2;
          el('rect', { x: ex - 28, y: ey - 9, width: 56, height: 18, rx: 3, fill: '#1c1017', stroke: '#ef4444', 'stroke-width': 1 }, linkLayer);
          txt('✕中断', { x: ex, y: ey + 3, 'text-anchor': 'middle', fill: '#ef4444', 'font-size': 9, 'font-weight': 'bold' }, linkLayer);
        }
      });

      // 大圆
      groups.forEach(g => {
        const dim = shouldDim(g);
        const op = dim ? 0.06 : 0.5;

        // 关键节点：金色光环
        if (g.isKey && !dim) {
          const kc = el('circle', { cx: g.cx, cy: g.cy, r: g.r + 8, fill: 'none', stroke: '#eab308', 'stroke-width': 2, opacity: 0.6 }, groupLayer);
          el('animate', { attributeName: 'r', values: `${g.r + 6};${g.r + 16};${g.r + 6}`, dur: '2s', repeatCount: 'indefinite' }, kc);
          el('animate', { attributeName: 'opacity', values: '0.3;0.8;0.3', dur: '2s', repeatCount: 'indefinite' }, kc);
        }

        el('circle', { cx: g.cx, cy: g.cy, r: g.r, fill: 'transparent', stroke: g.color, 'stroke-width': 1.5, 'stroke-dasharray': '6 3', opacity: op, class: 'draggable', 'data-group-id': g.id }, groupLayer);
        // 关键节点名称加星标
        const label = g.isKey ? '★ ' + g.name : g.name;
        txt(label, { x: g.cx, y: g.cy - g.r + 14, 'text-anchor': 'middle', fill: g.isKey && !dim ? '#fde68a' : g.color, 'font-size': 9, 'font-weight': 'bold', opacity: dim ? 0.06 : 0.8 }, labelLayer);
      });

      // 小圆
      groups.forEach(g => {
        const dim = shouldDim(g);
        g.nodes.forEach(n => {
          const p = nodePos[n.id];
          const isError = n.status === 'error';
          const isFaultLinkEndpoint = faultLinkNodes.has(n.id);
          const icon = deviceIcons[n.type] || '📦';

          let nodeOpacity = 1;
          if (faultMode && !isError && !isFaultLinkEndpoint) nodeOpacity = 0.06;
          if (keyMode && !g.isKey) nodeOpacity = 0.06;

          if (isError) {
            const gc = el('circle', { cx: p.cx, cy: p.cy, r: p.r + 4, fill: '#ef444415', stroke: '#ef4444', 'stroke-width': 1.5 }, nodeLayer);
            el('animate', { attributeName: 'opacity', values: '0.3;0.9;0.3', dur: '1.2s', repeatCount: 'indefinite' }, gc);
            el('animate', { attributeName: 'r', values: `${p.r + 2};${p.r + 10};${p.r + 2}`, dur: '1.2s', repeatCount: 'indefinite' }, gc);
            el('circle', { cx: p.cx, cy: p.cy, r: p.r, fill: '#ef444425', stroke: '#ef4444', 'stroke-width': 2, class: 'draggable', 'data-node-id': n.id }, nodeLayer);
          } else {
            el('circle', { cx: p.cx, cy: p.cy, r: p.r, fill: 'transparent', stroke: '#475569', 'stroke-width': 0.8, opacity: nodeOpacity, class: 'draggable', 'data-node-id': n.id }, nodeLayer);
          }
          txt(icon, { x: p.cx, y: p.cy - 2, 'text-anchor': 'middle', 'font-size': p.r > 18 ? 11 : 9, opacity: nodeOpacity }, nodeLayer);
          txt(n.name, { x: p.cx, y: p.cy + 10, 'text-anchor': 'middle', fill: isError ? '#fca5a5' : '#64748b', 'font-size': p.r > 18 ? 7 : 6, opacity: nodeOpacity }, nodeLayer);
        });
      });

      // 图例在 HTML 固定浮层中，不需要在 SVG 里画
    }

    // 构建 HTML 图例（只执行一次）
    function buildLegend() {
      const legend = document.getElementById('legend');
      let html = '<h4>链路类型</h4>';
      Object.values(linkStyles).forEach(s => {
        const svgLine = `<svg width="32" height="6"><line x1="0" y1="3" x2="32" y2="3" stroke="${s.color}" stroke-width="${s.width}" stroke-dasharray="${s.dash}"/></svg>`;
        html += `<div class="row">${svgLine}<span>${s.name}</span></div>`;
      });
      html += '<div class="sep"></div><h4>节点状态</h4>';
      html += `<div class="row"><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="transparent" stroke="#475569" stroke-width="1"/></svg><span>正常</span></div>`;
      html += `<div class="row"><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="#ef444425" stroke="#ef4444" stroke-width="1.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/></circle></svg><span style="color:#fca5a5">故障</span></div>`;
      html += `<div class="row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="#eab308" stroke-width="1.5"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/></circle></svg><span style="color:#fde68a">★ 关键节点</span></div>`;
      legend.innerHTML = html;
    }
    buildLegend();

    // 统计
    const errNodes = groups.reduce((c, g) => c + g.nodes.filter(n => n.status === 'error').length, 0);
    const errLinks = links.filter(l => l.status === 'error').length;
    document.getElementById('info').textContent = `${groups.length}个实体 · ${links.length}条链路 · ${errNodes}个设备故障 · ${errLinks}条链路中断`;

    render();
  </script>
</body>
</html>
